services:
  - type: web
    name: ct-spot-recommendations
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT app.main:app
    healthCheckPath: /healthz
    envVars:
      - key: GUNICORN_GEVENT
        value: "0"
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: BINANCE_REST_URL
        value: https://data-api.binance.vision/api/v3
      - key: BINANCE_STREAM_URL
        value: wss://data-stream.binance.vision:443/stream
      - key: SELECTED_SYMBOLS
        value: ""
      - key: INITIAL_CAPITAL_USDT
        value: "0"
      - key: MAX_CONCURRENT_POSITIONS
        value: "5"
      - key: DAILY_LOSS_LIMIT_PCT
        value: "0.09"
      - key: RISK_PER_TRADE_PCT
        value: "0.005"
      - key: STOP_LOSS_PCT
        value: "0.015"
      - key: TAKE_PROFIT_R_MULTIPLE
        value: "2.0"
      - key: EXECUTION_TIMEFRAME
        value: 1h
      - key: HIGHER_TIMEFRAME
        value: 4h
      - key: ADX_PERIOD
        value: "14"
      - key: ADX_MIN
        value: "25.0"
      - key: ATR_PERIOD
        value: "14"
      - key: ATR_MIN_PCT
        value: "0.003"
      - key: ATR_MAX_PCT
        value: "0.08"
      - key: WEBSOCKET_RECONNECT_GRACE_SECONDS
        value: "45"
      - key: STALE_DATA_SECONDS
        value: "180"
      - key: LOG_LEVEL
        value: INFO
