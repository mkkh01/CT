services:
  - type: web
    name: smart-trading-indicator
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -k uvicorn.workers.UvicornWorker --workers 1 --timeout 120 --bind 0.0.0.0:$PORT app.main:app
    healthCheckPath: /healthz
    envVars:
      - key: APP_NAME
        value: Smart Trading Indicator
      - key: APP_VERSION
        value: 1.0.0
      - key: CONFIG_VERSION
        value: core_v1
      - key: DISABLE_AUTO_START
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SELECTED_SYMBOLS
        value: BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT,ADAUSDT,DOGEUSDT,AVAXUSDT,LINKUSDT,DOTUSDT,TRXUSDT,LTCUSDT,BCHUSDT,NEARUSDT,UNIUSDT,ATOMUSDT,ETCUSDT,FILUSDT,APTUSDT,ARBUSDT
      - key: ENTRY_TIMEFRAME
        value: 15m
      - key: STRUCTURE_TIMEFRAME
        value: 1h
      - key: HTF_TIMEFRAME
        value: 4h
      - key: HISTORY_LIMIT
        value: "500"
      - key: MIN_SIGNAL_SCORE
        value: "80"
      - key: MIN_DIRECTION_GAP
        value: "15"
      - key: REQUIRE_CLOSED_CANDLE
        value: "true"
      - key: RR_TP1
        value: "1.0"
      - key: RR_TP2
        value: "2.0"
      - key: ATR_BUFFER_MULTIPLIER
        value: "0.1"
      - key: SWING_LEFT
        value: "3"
      - key: SWING_RIGHT
        value: "3"
      - key: ATR_PERIOD
        value: "14"
      - key: BINANCE_REST_URL
        value: https://data-api.binance.vision/api/v3
      - key: BINANCE_WS_URL
        value: wss://data-stream.binance.vision/stream
